<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cozy Cup Coffee Shop</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #3b2a1a;
      background: #fff8ef;
    }

    header {
      padding: 48px 20px;
      text-align: center;
      color: white;
      background: #68452c;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    h2 {
      color: #68452c;
    }

    .menu-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e3d5c5;
    }

    footer {
      padding: 20px;
      text-align: center;
      background: #efe1d0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cozy Cup Coffee Shop</h1>
    <p>Fresh coffee, warm pastries, and a cozy place to relax.</p>
  </header>

  <main>
    <section>
      <h2>Our Menu</h2>
      <div class="menu-item"><span>Espresso</span><span>$3.00</span></div>
      <div class="menu-item"><span>Cappuccino</span><span>$4.50</span></div>
      <div class="menu-item"><span>Vanilla Latte</span><span>$5.00</span></div>
      <div class="menu-item"><span>Chocolate Croissant</span><span>$3.50</span></div>
    </section>

    <section>
      <h2>Visit Us</h2>
      <p>123 Main Street, Your Town</p>
      <p>Open daily: 7:00 AM–6:00 PM</p>
      <p>Email: hello@cozycup.example</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Cozy Cup Coffee Shop</p>
  </footer>
</body>
</html>
